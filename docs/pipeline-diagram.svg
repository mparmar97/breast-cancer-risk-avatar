<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
  <title id="title">VARE adaptive orchestration pipeline</title>
  <desc id="desc">Pipeline with safety pre-check, conversational-state estimation, deterministic strategy selection combining FTT, HBM, MI, readiness, and Ottawa, vetted RAG, Groq wording, validation, and avatar delivery.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151"/>
    </marker>
    <style>
      .label { font: 600 12px Arial, Helvetica, sans-serif; fill: #111827; }
      .sublabel { font: 10px Arial, Helvetica, sans-serif; fill: #374151; }
      .caption { font: italic 11px Arial, Helvetica, sans-serif; fill: #6b7280; }
      .override-title { font: italic 11px Arial, Helvetica, sans-serif; fill: #b91c1c; }
      .box { stroke: #374151; stroke-width: 1.3; rx: 7; ry: 7; }
      .box-green { fill: #ecfdf5; }
      .box-blue { fill: #eff6ff; }
      .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; }
      .box-grey { fill: #f3f4f6; stroke: #dc2626; stroke-width: 1.6; }
      .box-consent { fill: #fafafa; stroke: #9ca3af; stroke-dasharray: 5 4; }
      .arrow { stroke: #374151; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .dashed-box { fill: none; stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 8 6; rx: 10; ry: 10; }
    </style>
  </defs>

  <!-- Consent -->
  <rect class="box box-consent" x="20" y="16" width="130" height="46"/>
  <text class="label" x="85" y="36" text-anchor="middle">Consent gate</text>
  <text class="sublabel" x="85" y="50" text-anchor="middle">(UI — before chat)</text>

  <!-- Override region -->
  <rect class="dashed-box" x="138" y="78" width="848" height="170"/>
  <text class="override-title" x="154" y="98">Fixed safety overrides (diagnosis · treatment · urgent symptoms · crisis)</text>

  <!-- Pipeline boxes -->
  <rect class="box box-green" x="20" y="148" width="108" height="58"/>
  <text class="label" x="74" y="172" text-anchor="middle">Gail-inspired</text>
  <text class="label" x="74" y="188" text-anchor="middle">risk estimate</text>

  <rect class="box box-red" x="148" y="148" width="92" height="58"/>
  <text class="label" x="194" y="172" text-anchor="middle">Safety</text>
  <text class="label" x="194" y="188" text-anchor="middle">pre-check</text>

  <rect class="box box-green" x="260" y="138" width="118" height="78"/>
  <text class="label" x="319" y="162" text-anchor="middle">Conversational-</text>
  <text class="label" x="319" y="178" text-anchor="middle">state estimation</text>
  <text class="sublabel" x="319" y="196" text-anchor="middle">classify + fallback</text>

  <rect class="box box-blue" x="398" y="124" width="162" height="106"/>
  <text class="label" x="479" y="148" text-anchor="middle">Deterministic strategy</text>
  <text class="label" x="479" y="164" text-anchor="middle">selection</text>
  <text class="sublabel" x="479" y="182" text-anchor="middle">FTT · HBM · MI · readiness · Ottawa</text>
  <text class="sublabel" x="479" y="198" text-anchor="middle">(state + decisional needs in)</text>
  <text class="sublabel" x="479" y="214" text-anchor="middle">Groq never chooses</text>

  <rect class="box box-blue" x="580" y="148" width="108" height="58"/>
  <text class="label" x="634" y="172" text-anchor="middle">Vetted local</text>
  <text class="label" x="634" y="188" text-anchor="middle">RAG (17 chunks)</text>

  <rect class="box box-blue" x="708" y="138" width="118" height="78"/>
  <text class="label" x="767" y="162" text-anchor="middle">Dynamic Groq</text>
  <text class="label" x="767" y="178" text-anchor="middle">wording</text>
  <text class="sublabel" x="767" y="196" text-anchor="middle">+ local fallback</text>

  <rect class="box box-grey" x="846" y="148" width="118" height="58"/>
  <text class="label" x="905" y="172" text-anchor="middle">Safety +</text>
  <text class="label" x="905" y="188" text-anchor="middle">validation</text>

  <rect class="box box-green" x="1050" y="138" width="108" height="78"/>
  <text class="label" x="1104" y="162" text-anchor="middle">Text UI +</text>
  <text class="label" x="1104" y="178" text-anchor="middle">avatar</text>
  <text class="sublabel" x="1104" y="196" text-anchor="middle">verbatim lip-sync</text>

  <!-- Arrows -->
  <path class="arrow" d="M 128 177 H 148"/>
  <path class="arrow" d="M 240 177 H 260"/>
  <path class="arrow" d="M 378 177 H 398"/>
  <path class="arrow" d="M 560 177 H 580"/>
  <path class="arrow" d="M 688 177 H 708"/>
  <path class="arrow" d="M 826 177 H 846"/>
  <path class="arrow" d="M 964 177 H 1050"/>

  <path d="M 85 62 V 120 H 74 V 148" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>

  <text class="caption" x="590" y="290" text-anchor="middle">Consent is a UI gate before the calculator. Strategy selection uses conversational state and decisional needs together; Groq only phrases the chosen strategy.</text>
</svg>
